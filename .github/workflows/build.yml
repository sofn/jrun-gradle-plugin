name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  # 每周一 03:00 UTC 跑一次 Gradle 兼容性矩阵（也可以手动触发）
  schedule:
    - cron: '0 3 * * 1'

jobs:
  test:
    name: test (${{ matrix.os }}, JDK ${{ matrix.java }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        java: [ 17, 21, 25 ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # TestKit 的依赖缓存（Kotlin / Spring Boot 插件等）；daemon 目录不缓存
      - name: Cache TestKit dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/jrun-testkit/caches/modules-2
            ~/.gradle/jrun-testkit/wrapper
          key: testkit-${{ runner.os }}-${{ hashFiles('src/test/**/*.java') }}
          restore-keys: testkit-${{ runner.os }}-

      - name: Build and test (non-Windows)
        if: runner.os != 'Windows'
        run: ./gradlew build --no-daemon --stacktrace

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: ./gradlew.bat build --no-daemon --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}-${{ matrix.java }}
          path: build/reports/tests/test
          if-no-files-found: ignore

  # 兼容性长跑：在多个 Gradle 版本上验证插件（每周定时 + 手动触发，不在每次提交都跑）
  gradle-compat:
    name: gradle ${{ matrix.gradle }}
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        gradle: [ '8.14.3', '9.0.0', '9.8.2' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache TestKit dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/jrun-testkit/caches/modules-2
            ~/.gradle/jrun-testkit/wrapper
          key: testkit-compat-${{ matrix.gradle }}-${{ hashFiles('src/test/**/*.java') }}
          restore-keys: testkit-compat-${{ matrix.gradle }}-
      - name: Run tests against Gradle ${{ matrix.gradle }}
        run: ./gradlew test --no-daemon -PgradleCompatVersion=${{ matrix.gradle }}
