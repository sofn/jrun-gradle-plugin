name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  # 每周一 03:00 UTC 跑一次 Gradle 兼容性矩阵（也可以手动触发）
  schedule:
    - cron: '0 3 * * 1'

jobs:
  test:
    name: test (${{ matrix.os }}, JDK ${{ matrix.java }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        java: [ 17, 21, 25 ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # TestKit 的依赖缓存（Kotlin / Spring Boot 插件等）；daemon 目录不缓存
      - name: Cache TestKit dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/jrun-testkit/caches/modules-2
            ~/.gradle/jrun-testkit/wrapper
          key: testkit-${{ runner.os }}-${{ hashFiles('src/test/**/*.java') }}
          restore-keys: testkit-${{ runner.os }}-

      - name: Build and test (non-Windows)
        if: runner.os != 'Windows'
        run: ./gradlew build --no-daemon --stacktrace

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: ./gradlew.bat build --no-daemon --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}-${{ matrix.java }}
          path: build/reports/tests/test
          if-no-files-found: ignore

  # 安装脚本冒烟：用本次构建出的资产走一遍真实安装（Linux/macOS 用 file://，Windows 用本地 HTTP）
  installer:
    name: installer (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble release assets
        shell: bash
        run: ./gradlew jrunDist --no-daemon
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          JRUN_DOWNLOAD_BASE="file://$PWD/build/dist" JRUN_INSTALL_DIR="$RUNNER_TEMP/bin" JRUN_HOME="$RUNNER_TEMP/jrun" sh installer/install.sh
          "$RUNNER_TEMP/bin/jrun" --version
          cd "$RUNNER_TEMP" && JRUN_HOME="$RUNNER_TEMP/jrun" "$RUNNER_TEMP/bin/jrun" init demo
          test -f demo/gradlew && test -f demo/main/Main.java
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--directory', 'build/dist' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          try {
            $env:JRUN_DOWNLOAD_BASE = 'http://127.0.0.1:8765'
            $env:JRUN_INSTALL_DIR = "$env:RUNNER_TEMP\bin"
            $env:JRUN_HOME = "$env:RUNNER_TEMP\jrun"
            powershell -ExecutionPolicy ByPass -File installer/install.ps1
            if ($LASTEXITCODE -ne 0) { throw 'install.ps1 failed' }
            & "$env:RUNNER_TEMP\bin\jrun.bat" --version
            Set-Location $env:RUNNER_TEMP
            & "$env:RUNNER_TEMP\bin\jrun.bat" init demo
            if (-not (Test-Path demo\gradlew.bat)) { throw 'jrun init did not copy the Gradle wrapper' }
          } finally {
            Stop-Process -Id $server.Id
          }

  # 兼容性长跑：在多个 Gradle 版本上验证插件（每周定时 + 手动触发，不在每次提交都跑）
  gradle-compat:
    name: gradle ${{ matrix.gradle }}
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        gradle: [ '8.14.3', '9.0.0', '9.8.2' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache TestKit dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/jrun-testkit/caches/modules-2
            ~/.gradle/jrun-testkit/wrapper
          key: testkit-compat-${{ matrix.gradle }}-${{ hashFiles('src/test/**/*.java') }}
          restore-keys: testkit-compat-${{ matrix.gradle }}-
      - name: Run tests against Gradle ${{ matrix.gradle }}
        run: ./gradlew test --no-daemon -PgradleCompatVersion=${{ matrix.gradle }}
