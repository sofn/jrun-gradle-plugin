name: release

# 推送 v* 标签：校验标签与版本一致 → 完整构建 → 打包资产 → 创建 GitHub Release
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tag must match the project version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Build, test and assemble the release assets
        run: ./gradlew build jrunDist --no-daemon
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/dist/* --title "jrun $GITHUB_REF_NAME" --generate-notes
